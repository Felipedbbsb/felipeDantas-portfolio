<!doctype html>
<html lang="en" data-lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Felipe Dantas Borges — Portfolio PDF</title><link rel="stylesheet" href="src/styles.css"></head><body data-base=""><main id="print-content"></main><script type="module">
import { projects, translations } from './src/data.js';
const lang = new URLSearchParams(location.search).get('lang') === 'pt' ? 'pt' : 'en'; const t = translations[lang];
document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
document.querySelector('#print-content').innerHTML = `<section class="section-shell hero"><div class="hero-copy"><p class="eyebrow">${t['hero.eyebrow']}</p><h1>Felipe Dantas<br><em>Borges.</em></h1><p class="hero-lede">${t['hero.lede']}</p><p class="eyebrow">felipedbbsb@gmail.com · (61) 99678-0567</p></div><div class="hero-art"><img src="public/assets/profile/felipe.jpg" alt="Felipe Dantas Borges"></div></section><section class="section-shell intro-grid"><p class="section-index">${t['section.about']}</p><div><h2>${t['about.title']}</h2><p class="body-large">${t['about.body']}</p><p class="body-large">${t['skills.languages']}: C, C++, C#, Rust, Python, JavaScript, TypeScript, GDScript, Assembly RISC-V.</p></div></section><section class="section-shell projects-section"><div class="section-heading"><div><p class="section-index">${t['section.projects']}</p><h2>${t['projects.title']}</h2></div></div><div class="project-grid">${projects.map(p => `<article class="project-card"><div class="project-image"><img src="public/assets/projects/${p.image}" alt="${p.title[lang]}"></div><div class="project-meta"><span>${p.year}</span><span>${p.type[lang]}</span></div><h3>${p.title[lang]}</h3><p>${p.description[lang]}</p><div class="tag-list">${p.tags.map(tag => `<span>${tag}</span>`).join('')}</div><div class="project-links">${p.links.map(link => `<a href="${link.url}">${link.label} ↗</a>`).join('')}</div></article>`).join('')}</div></section></main></body></html>`;
</script></body></html>
