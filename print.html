<!doctype html>
<html lang="en" data-lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Felipe Dantas Borges — Portfolio PDF</title>
  <link rel="stylesheet" href="src/styles.css">
  <link rel="stylesheet" href="src/print.css">
</head>
<body data-base="">
  <main id="print-content"></main>
  <script type="module">
    import { projects, translations } from './src/data.js';
    import { renderPrintDocument } from './src/print-render.js';

    const language = new URLSearchParams(location.search).get('lang') === 'pt' ? 'pt' : 'en';
    document.documentElement.lang = language === 'pt' ? 'pt-BR' : 'en';
    document.documentElement.dataset.lang = language;
    document.querySelector('#print-content').innerHTML = renderPrintDocument({
      projects,
      translation: translations[language],
      language
    });
  </script>
</body>
</html>
